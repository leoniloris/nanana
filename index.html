<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photos</title>

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.4 system-ui, sans-serif;
    background: #0e0e10; color: #eee;
  }
  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; background: #0e0e10;
    z-index: 20;
  }
  #gate input {
    padding: 10px 14px; font-size: 16px; border-radius: 8px; border: 1px solid #333;
    background: #1a1a1e; color: #eee; width: min(320px, 80vw);
  }
  #gate button {
    padding: 10px 20px; font-size: 15px; border-radius: 8px; border: 0;
    background: #3b82f6; color: #fff; cursor: pointer;
  }
  #gate .err { color: #f87171; min-height: 1em; }
  header {
    position: sticky; top: 0; z-index: 10; padding: 10px 14px;
    background: rgba(14,14,16,.9); backdrop-filter: blur(8px);
    display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #222;
  }
  #q {
    flex: 1; padding: 9px 12px; font-size: 15px; border-radius: 8px;
    border: 1px solid #333; background: #1a1a1e; color: #eee;
  }
  #count { color: #888; white-space: nowrap; }
  #grid {
    display: grid; gap: 4px; padding: 4px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .cell {
    position: relative; aspect-ratio: 1; background: #1a1a1e;
    overflow: hidden; border-radius: 4px; cursor: pointer;
    /* skip layout/paint for offscreen cells — keeps huge grids smooth */
    content-visibility: auto; contain-intrinsic-size: auto 180px;
  }
  .cell img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity .2s;
  }
  .cell img.on { opacity: 1; }
  .cell .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px;
    font-size: 11px; color: #ddd; background: linear-gradient(transparent, rgba(0,0,0,.7));
    opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  .cell:hover .cap { opacity: 1; }
  #viewer {
    position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.95);
    display: none; overflow: hidden;
  }
  #viewer.on { display: block; }
  #stage {
    position: absolute; inset: 0; display: flex; width: 100%; height: 100%;
    touch-action: pan-y; will-change: transform;
  }
  #stage.anim { transition: transform .28s cubic-bezier(.22,.61,.36,1); }
  #stage .slot {
    position: relative; flex: 0 0 100%; width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  #stage img, #stage video {
    max-width: 96vw; max-height: 88vh; object-fit: contain;
    -webkit-user-drag: none; user-select: none; pointer-events: auto;
  }
  #stage .vbadge {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: rgba(255,255,255,.9); font-size: 54px; text-shadow: 0 2px 8px rgba(0,0,0,.7);
    pointer-events: none;
  }
  #viewer .meta {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
    color: #ccc; padding: 8px; font-size: 13px; text-align: center;
    background: linear-gradient(transparent, rgba(0,0,0,.7)); pointer-events: none;
  }
  #viewer .close { position: absolute; top: 14px; right: 18px; font-size: 28px; cursor: pointer; z-index: 4; }
  .cell.vid::after {
    content: "▶"; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); color: rgba(255,255,255,.9);
    font-size: 26px; text-shadow: 0 1px 5px rgba(0,0,0,.7); pointer-events: none;
  }
</style>
</head>
<body>
  <div id="gate">
    <div style="font-size:20px">🔒 Photos</div>
    <input id="pw" type="password" placeholder="Password" autofocus>
    <button id="unlock">Unlock</button>
    <div class="err" id="err"></div>
  </div>

  <header hidden id="bar">
    <input id="q" placeholder="Fuzzy search: place, date, camera, keywords…">
    <span id="count"></span>
  </header>
  <div id="grid"></div>

  <div id="viewer">
    <div class="close" id="vclose">✕</div>
    <div id="stage">
      <div class="slot" data-slot="prev"></div>
      <div class="slot" data-slot="cur"></div>
      <div class="slot" data-slot="next"></div>
    </div>
    <div class="meta" id="vmeta"></div>
  </div>
